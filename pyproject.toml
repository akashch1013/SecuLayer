[project]
name = "seculayer"
version = "0.1.0"
description = "Educational demo of prompt injection and a layered defense module."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "openai==3.28.0",
    "onnxruntime==1.31.0",
    "tokenizers==0.23.3",
    "numpy==2.5.3",
    "beautifulsoup4==4.15.0",
    "typer==0.27.3",
    "httpx==0.28.1",
    "mcp==2.3.0",
]

[project.scripts]
seculayer = "seculayer_demo.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seculayer", "src/seculayer_demo"]

[tool.uv]
exclude-newer = "2026-10-10"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic characters the UI copy and the trust policy use on purpose (ˆ is the datamark).
allowed-confusables = ["ˆ", "‹", "‘", "’", "“", "”", "–", "×", "−", "÷"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["seculayer"]

[[tool.mypy.overrides]]
module = "seculayer.*"
strict = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = ["live: makes real network calls; opt in with -m live"]
